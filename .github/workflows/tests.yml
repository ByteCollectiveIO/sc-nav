name: tests

# Safety net: run every suite on push and PR so a regression is caught before it
# reaches main (and before a release tag is cut from it).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v4/v5 target Node 20, which the runners now force onto Node 24 with a
      # deprecation warning; these majors run on Node 24 natively.
      - uses: actions/checkout@v7

      # Match the deploy target (Dockerfile: python:3.12-slim).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The nav_core suite is pure stdlib and reads the committed poi/ dataset,
      # so no dependency install is needed.
      - name: Run nav_core tests
        working-directory: server
        run: python test_nav_core.py

      # The watcher suite is the code that runs on members' own machines, so it
      # gets the same gate as the server. Also pure stdlib — tkinter is imported
      # lazily inside the overlay's functions, never at module scope — so it runs
      # before the dependency install and can't be broken by one.
      # It went unenforced until v1.1.1, which is how a token-leak fix nearly
      # shipped with no CI covering its regression test.
      - name: Run watcher tests
        working-directory: watcher
        run: python test_parse.py

      # The app suite drives the FastAPI shell through a TestClient to pin the
      # CSP nonce backstop, so it needs the runtime deps.
      - name: Install runtime deps
        working-directory: server
        # httpx2: the TestClient transport. Starlette 1.x imports httpx2 first and
        # only falls back to httpx with a deprecation warning, so this is the
        # supported spelling. Test-only — it is NOT in requirements.txt and never
        # reaches the image (Dockerfile installs requirements.txt alone).
        run: pip install -r requirements.txt httpx2

      - name: Run app (HTTP) tests
        working-directory: server
        # Pin the starmap.space feeds to the committed poi/ cache by pointing
        # their URLs at an unroutable address: the fetch fails instantly and
        # load_nav_data falls back to the committed snapshot. Without this the
        # suite runs against whatever starmap.space says today — a 2026-08-06
        # upstream revision (dropped the ARC-L1 station container) broke it with
        # zero code change. NOT SC_NAV_OFFLINE: that would also disable the
        # uexcorp fetches, whose caches are gitignored, and the quantum/craft/
        # contribution tests fail without that data.
        env:
          SC_NAV_OC_URL: "http://127.0.0.1:9/oc"
          SC_NAV_POI_URL: "http://127.0.0.1:9/pois"
        run: python test_app.py
