name: tests

# Safety net: run every suite on push and PR so a regression is caught before it
# reaches main (and before a release tag is cut from it).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v4/v5 target Node 20, which the runners now force onto Node 24 with a
      # deprecation warning; these majors run on Node 24 natively.
      - uses: actions/checkout@v7

      # Match the deploy target (Dockerfile: python:3.12-slim).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The nav_core suite is pure stdlib and reads the committed poi/ dataset,
      # so no dependency install is needed.
      - name: Run nav_core tests
        working-directory: server
        run: python test_nav_core.py

      # The watcher suite is the code that runs on members' own machines, so it
      # gets the same gate as the server. Also pure stdlib — tkinter is imported
      # lazily inside the overlay's functions, never at module scope — so it runs
      # before the dependency install and can't be broken by one.
      # It went unenforced until v1.1.1, which is how a token-leak fix nearly
      # shipped with no CI covering its regression test.
      - name: Run watcher tests
        working-directory: watcher
        run: python test_parse.py

      # The app suite drives the FastAPI shell through a TestClient to pin the
      # CSP nonce backstop, so it needs the runtime deps.
      - name: Install runtime deps
        working-directory: server
        # httpx2: the TestClient transport. Starlette 1.x imports httpx2 first and
        # only falls back to httpx with a deprecation warning, so this is the
        # supported spelling. Test-only — it is NOT in requirements.txt and never
        # reaches the image (Dockerfile installs requirements.txt alone).
        run: pip install -r requirements.txt httpx2

      # The uexcorp loaders fetch live with an on-disk cache fallback, and those
      # caches are gitignored per-deployment runtime data — so a fresh checkout
      # had none and CI fetched the live UEX API on every run. On 2026-09-19 a
      # runner lost the network mid-run ("Connection reset by peer"), the
      # catalogs came back empty, 8 tests failed, and since `tag-release` only
      # fires when `tests` SUCCEEDS on main, it skipped and the v1.14.3 release
      # silently never happened. Seeding the committed fixtures and running
      # offline (below) removes the network from the gate entirely.
      - name: Seed UEX feed fixtures
        run: cp server/testdata/uex/*.json poi/

      - name: Run app (HTTP) tests
        working-directory: server
        # No starmap URL pin needed anymore: the container/POI catalogs are
        # vendored snapshots (tools/sync_containers.py) and the app has no
        # runtime fetch path for them.
        #
        # SC_NAV_OFFLINE=1 makes the uexcorp loaders skip the fetch and read the
        # seeded cache, so this step is hermetic: no network, deterministic, and
        # it exercises the same offline path a self-hosting org runs when they
        # set SC_NAV_OFFLINE. Regenerate the fixtures with
        # `python3 tools/make_test_fixtures.py` (see that file's header) when a
        # new test needs a feed row the fixture doesn't carry — the symptom is an
        # empty-catalog failure here that doesn't reproduce on a dev box, whose
        # poi/ cache is populated with the full live feeds.
        env:
          SC_NAV_OFFLINE: "1"
        run: python test_app.py
