name: tag-release

# Auto-tag a release once it lands on main. Closes the gap where tagging used to be
# a manual second `/deploy` pass that was easy to forget (v0.28.0 and v0.28.1 both
# shipped to main untagged before this existed).
#
# It fires only after the `tests` workflow succeeds on main, reads the version from
# server/version.py (robust against the squash-merge "(#N)" suffix that trips
# commit-subject parsing), and pushes vX.Y.Z if that tag doesn't exist yet. The tag
# is pure bookkeeping — the server is still rebuilt by hand — so auto-creating it is
# safe. The manual PR merge stays the deliberate review gate; the tag is not a gate.
#
# It then publishes a GitHub Release for that tag, because a tag alone notifies
# nobody: self-hosting orgs subscribe via Watch -> Custom -> Releases to learn an
# update exists and whether it needs action. Notes come from the release PR's body,
# NOT from --generate-notes — /deploy is squash-only, so every commit subject on
# main is just "Release vX.Y.Z (#N)" and generated notes would say nothing. The
# "(#N)" suffix this file works around above is what makes the PR easy to find.
#
# Finally it fast-forwards the `stable` branch to the released commit. `stable` is
# the deployment channel self-hosting orgs point Portainer at: their "Pull and
# redeploy" click has to land on a RELEASE, not on whatever happened to be the tip
# of main that afternoon. A tag can't do that job — Portainer accepts refs/tags/…
# but a pinned tag never moves, so every upgrade would mean hand-editing the stack's
# reference field. A branch that only ever advances to release commits does.
# So: main = trunk (the dev stack polls it), stable = releases (prod pulls it).
#
# WHY THIS JOB RUNS EVEN WHEN `tests` FAILED (2026-09-19). It used to carry
# `if: workflow_run.conclusion == 'success'`, so a red `tests` run on main made
# this job SKIP — and a skipped job is not a failed one: it is green-grey, it
# notifies nobody, and the release simply doesn't happen. That is exactly how
# v1.14.3 merged, went untagged and unreleased, and left `stable` on v1.14.2
# while main rolled forward. Nothing surfaced it; the PR page still showed a
# green check, because that check is the PR-BRANCH run, a different run from the
# post-merge one on main. The guard now lives in a step that FAILS instead, so
# a stalled release is a red X with a message saying what didn't ship.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # v7: the runners force Node-20 actions onto Node 24 and warn; v5+ targets
      # Node 24 natively. v7 also refuses to check out FORK pull-request code from
      # a workflow_run job (the "pwn request" hole) — this job is unaffected: it
      # only ever runs off a push to main, whose workflow_run.event is "push", not
      # "pull_request*", so the guard returns before it ever looks at the ref.
      - uses: actions/checkout@v7
        with:
          # Tag the exact commit tests ran on, and fetch tags to check existence.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version from server/version.py
        id: ver
        run: |
          v=$(python -c "import re,pathlib; \
            print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', \
            pathlib.Path('server/version.py').read_text()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The gate that used to be `if: conclusion == 'success'` on the job. Failing
      # here rather than skipping is the whole point: this is the only thing that
      # tells anyone a merged release didn't ship.
      #
      # It distinguishes the two cases with no extra bookkeeping, because
      # server/version.py already separates them: on a RELEASE merge it names a
      # version whose tag does not exist yet (that's what the next step would
      # create), while on an ordinary merge it names the version already tagged.
      # So "tag missing + tests red" == a release just stalled; "tag present +
      # tests red" == main is broken but nothing was due to ship.
      #
      # Both fail. A red main deserves a signal too, and the messages say which
      # situation it is so the red X is never ambiguous.
      - name: Require a green tests run
        if: github.event.workflow_run.conclusion != 'success'
        env:
          V: ${{ steps.ver.outputs.version }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tests on main concluded '$CONCLUSION' ($RUN_URL). Nothing was due to ship (v$V is already tagged), but main is not green."
            {
              echo "## main is not green"
              echo
              echo "\`tests\` concluded **$CONCLUSION** on \`$SHA\`."
              echo "No release was pending — v$V is already tagged — so nothing stalled."
              echo
              echo "[Failed run]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::RELEASE STALLED: v$V merged to main but was NOT tagged, NOT released, and stable was NOT advanced, because tests concluded '$CONCLUSION' ($RUN_URL)."
            {
              echo "## Release v$V did not ship"
              echo
              echo "\`tests\` concluded **$CONCLUSION** on \`$SHA\`, so this workflow"
              echo "did not tag \`v$V\`, did not publish its GitHub Release, and left"
              echo "\`stable\` where it was. Self-hosting orgs will not see this version."
              echo
              echo "[Failed run]($RUN_URL)"
              echo
              echo "### If the failure was infrastructure, not code"
              echo
              echo "Verify the merged commit locally, then re-run the failed jobs —"
              echo "a re-run emits a fresh \`workflow_run\` event and this workflow"
              echo "picks it up on its own:"
              echo
              echo '```'
              echo "cd server && .venv/bin/python test_app.py"
              echo "gh run rerun ${{ github.event.workflow_run.id }} --failed"
              echo '```'
              echo
              echo "Do **not** push the tag or \`stable\` by hand."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - name: Create + push tag if missing
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already tagged — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"
          echo "Tagged and pushed v$V."

      - name: Publish release from the PR body
        env:
          V: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Independent of the tag check above: a re-run, or a version tagged
          # before this step existed, should still get its release.
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V already released — nothing to do."
            exit 0
          fi
          # Squash merges end the subject with "(#N)"; that N is the release PR.
          pr=$(git log -1 --pretty=%s | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')
          if [ -n "$pr" ] && gh pr view "$pr" --json body -q .body > notes.md \
             && [ -s notes.md ]; then
            echo "Notes from PR #$pr."
          else
            # Never block the release on note-fetching — an untitled release is
            # still a notification; a failed job is not.
            printf 'See the release PR for details: %s/commit/%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$(git rev-parse HEAD)" > notes.md
            echo "No PR body found — published with a fallback pointer."
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md
          echo "Released v$V."

      - name: Advance the stable channel
        env:
          V: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Last, so `stable` never points at a commit whose GitHub Release
          # doesn't exist yet — an org that pulls the moment it moves should find
          # release notes waiting for it.
          #
          # GUARD, and it's the whole point of this step: this workflow runs on
          # EVERY push to main, not just releases. The tag/release steps above are
          # self-limiting (already tagged -> no-op), but an unguarded push here
          # would drag `stable` forward on every ordinary merge and hand orgs the
          # trunk we just went to the trouble of hiding from them. So: advance only
          # when v$V is THIS commit, i.e. the tag step above just created it.
          # Ordinary merge -> v$V already exists on an older commit -> skip.
          tagged=$(git rev-parse -q --verify "refs/tags/v$V^{commit}" || true)
          if [ "$tagged" != "$SHA" ]; then
            echo "v$V is not this commit ($tagged) — not a release merge, leaving stable alone."
            exit 0
          fi
          # Deliberately a plain push, not --force: `stable` only ever trails
          # main, and main is linear (squash-only merges), so every release
          # commit descends from the last one and this is always a fast-forward.
          # If it ever isn't, main was rewritten and the right outcome is a loud
          # red job, not a channel silently yanked backward under a live org.
          # Re-runs are safe: pushing the same SHA again is a no-op.
          git push origin "$SHA:refs/heads/stable"
          echo "stable -> v$V ($SHA)"
